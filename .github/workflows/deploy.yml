name: Pipeline Tests, Seguridad y Despliegue - Proyecto DSBP

on:
  push:
    branches: ["main", "feature/vulnerabilidades"]

jobs:
  # 1. Pruebas Unitarias y Análisis de Seguridad Estático
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest bandit

      - name: Escaneo de seguridad del código (Bandit)
        run: bandit -r . -s B101

      - name: Ejecutar pruebas unitarias con Pytest
        run: python -m pytest

  # 2. Construcción, Escaneo de Imágenes y Despliegue SSH
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test-and-security
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen backend (Local para escaneo)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: santiagob084/mi-api:latest

      - name: Construir y subir imagen nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: santiagob084/mi-nginx:latest

      - name: Construir y subir imagen frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: santiagob084/mi-frontend:latest

      - name: Escanear contenedor con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'santiagob084/mi-api:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Subir imagen backend a Docker Hub
        run: docker push santiagob084/mi-api:latest

      - name: Desplegar en servidor Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/proyecto-dsbp
            git pull origin main
            docker compose pull
            docker compose up -d --build