services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-flask_db}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppassword}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - red-dsbp

  app:
    image: ${DOCKER_USERNAME:-santiagob084}/mi-api:latest
    container_name: flask_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppassword}
      DB_NAME: ${DB_NAME:-flask_db}
      DB_PORT: 3306
      FLASK_DEBUG: "false"
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - red-dsbp

  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_proxy_manager
    restart: always
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - red-dsbp

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime_kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - kuma_data:/app/data
    networks:
      - red-dsbp

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle_logs
    restart: always
    ports:
      - "8080:8080"
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - red-dsbp

networks:
  red-dsbp:
    driver: bridge

volumes:
  db_data:
  npm_data:
  npm_letsencrypt:
  kuma_data: